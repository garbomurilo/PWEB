<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1 - Formulário Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        /* Estilização para ficar similar ao slide */
        .container {
            background-color: #00baba;
            padding: 30px 40px;
            width: 450px;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            font-weight: normal;
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 1px solid white;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        /* Campos de texto */
        input[type="text"],
        input[type="email"],
        textarea {
            width: 80%;
            padding: 6px;
            border: none;
            outline: none;
        }

        /* Seção dos Radio Buttons */
        .pesquisa-section {
            text-align: center;
            margin-top: 30px;
        }

        .pesquisa-section span {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .pesquisa-section p {
            font-size: 12px;
            font-style: italic;
            margin-bottom: 10px;
        }

        .radio-group label {
            display: inline-block;
            margin: 0 10px;
            font-size: 14px;
        }

        /* Botões */
        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        .buttons input {
            padding: 5px 15px;
            margin: 0 5px;
            border: none;
            background-color: #f0f0f0;
            cursor: pointer;
            border-radius: 3px;
        }

        .buttons input:hover {
            background-color: #ddd;
        }
    </style>

    <script>
        // Função validar no evento onsubmit do Form
        function validar() {
            // Utilizando document.nomeform.elements[] conforme exigido no slide
            var nome = document.nomeform.elements['nome'].value;
            var email = document.nomeform.elements['email'].value;
            var comentario = document.nomeform.elements['comentario'].value;
            var pesquisa = document.nomeform.elements['pesquisa'];

            // Validação: Nome não pode ter menos que 10 caracteres
            if (nome.length < 10) {
                alert("O Nome não pode ter menos que 10 caracteres.");
                return false; 
            }

            // Validação do Email (O tipo "email" no HTML já faz validação básica, mas verificamos se está vazio)
            if (email === "") {
                alert("Por favor, preencha o e-mail.");
                return false;
            }

            // Validação: Comentário deve ter no mínimo 20 caracteres
            if (comentario.length < 20) {
                alert("O Comentário deve ter no mínimo 20 caracteres.");
                return false;
            }

            // Validação: Pesquisa (obrigatório) e uso do atributo name "pesquisa" nos radios
            var selecionado = false;
            var valorPesquisa = "";
            
            for (var i = 0; i < pesquisa.length; i++) {
                if (pesquisa[i].checked) {
                    selecionado = true;
                    valorPesquisa = pesquisa[i].value;
                    break;
                }
            }

            if (!selecionado) {
                alert("O campo Pesquisa é obrigatório.");
                return false;
            }

            // Regra de retorno baseada na opção selecionada
            if (valorPesquisa === "Não") {
                alert("Que bom que você voltou a visitar esta página!");
            } else if (valorPesquisa === "Sim") {
                alert("Volte sempre à esta página!");
            }

            // Retorna false aqui apenas para evitar o recarregamento da página e podermos ler o alert.
            // Para enviar de verdade ao backend, altere para 'return true;'
            return false;
        }
    </script>
</head>
<body>

    <div class="container">
        <h2>Formulário Principal</h2>
        
        <form name="nomeform" onsubmit="return validar()">
            
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="form-group">
                <label for="comentario">Comentário:</label>
                <textarea name="comentario" id="comentario" rows="3"></textarea>
            </div>

            <div class="pesquisa-section">
                <span>Pesquisa:</span>
                <p>Primeira vez nesta página??</p>
                <div class="radio-group">
                    <label><input type="radio" name="pesquisa" value="Sim"> Sim</label>
                    <label><input type="radio" name="pesquisa" value="Não"> Não</label>
                </div>
            </div>

            <div class="buttons">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>

        </form>
    </div>

</body>
</html>
